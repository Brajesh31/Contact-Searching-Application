<rect x="40" y="155" width="150" height="72" rx="14" fill="#0f766e"/>
<rect x="245" y="155" width="170" height="72" rx="14" fill="#2563eb"/>
<rect x="470" y="155" width="160" height="72" rx="14" fill="#4f46e5"/>
<rect x="690" y="155" width="165" height="72" rx="14" fill="#7c3aed"/>
<rect x="910" y="155" width="150" height="72" rx="14" fill="#0f766e"/>
<g stroke="none"><text x="115" y="198">Start</text><text x="330" y="185">Load contacts</text><text x="330" y="208">from file</text><text x="550" y="198">Show menu</text><text x="772" y="185">Run selected</text><text x="772" y="208">operation</text><text x="985" y="198">Save file</text></g>
</g>

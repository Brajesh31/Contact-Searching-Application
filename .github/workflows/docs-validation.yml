name: Documentation and Repository Validation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/**"
      - ".markdownlint-cli2.jsonc"
      - ".yamllint"
      - ".gitleaks.toml"
      - "PROJECT_STATUS.md"
      - "AUTHORS.md"
      - "CITATION.cff"
      - "CODE_STYLE.md"
      - "GOVERNANCE.md"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/**"
      - ".markdownlint-cli2.jsonc"
      - ".yamllint"
      - ".gitleaks.toml"
      - "PROJECT_STATUS.md"
      - "AUTHORS.md"
      - "CITATION.cff"
      - "CODE_STYLE.md"
      - "GOVERNANCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Validate documentation, assets, and repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate local Markdown links
        run: python scripts/validate_docs.py

      - name: Validate Markdown structure
        run: python scripts/validate_markdown.py

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md" ".github/**/*.md"

      - name: Validate YAML workflows and issue forms
        run: |
          python -m pip install --disable-pip-version-check yamllint==1.38.0
          yamllint -c .yamllint .github

      - name: Validate SVG assets
        run: python scripts/validate_svg.py

      - name: Validate Markdown image assets
        run: python scripts/verify-assets.py

      - name: Validate Mermaid source structure
        run: python scripts/validate_mermaid.py

      - name: Check environment-variable examples
        run: python scripts/check-env-example.py

      - name: Check project structure
        run: python scripts/check-project-structure.py

      - name: Check license
        run: python scripts/check_license.py

      - name: Verify repository and preservation boundary
        run: python scripts/repository_audit.py

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile application for CodeQL tracing
        run: g++ -std=gnu++17 -Wall -Wextra -c main.cpp -o /tmp/contact-search.o

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

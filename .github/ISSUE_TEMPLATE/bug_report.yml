name: "🐛 Bug report"
description: Report a reproducible problem using synthetic contact data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real names, phone numbers, email addresses, address books, or exported contact files."
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Compile ... 2. Run ... 3. Select ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed personal information.
          required: true
